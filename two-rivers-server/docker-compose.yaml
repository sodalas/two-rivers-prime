services:
  redis:
    image: redis:7
    container_name: two-rivers-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  neo4j:
    image: neo4j:5
    container_name: two-rivers-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    restart: unless-stopped