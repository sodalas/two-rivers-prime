services:
  redis:
    image: redis:7
    container_name: two-rivers-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  neo4j:
    image: neo4j:5
    container_name: two-rivers-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: two-rivers-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: two_rivers_auth
    ports:
      - "5432:5432"
    restart: unless-stopped